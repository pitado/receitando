name: Relatar um bug
description: Informe um problema reproduzível no Receitando.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a melhorar o Receitando. Não publique secrets, tokens, senhas ou dados privados. Vulnerabilidades devem seguir `SECURITY.md`.
  - type: textarea
    id: problem
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento observado.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que deveria acontecer?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir?
      description: Liste passos claros e use apenas dados de teste.
      placeholder: |
        1. Acesse...
        2. Clique em...
        3. Observe...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área afetada
      options:
        - Frontend
        - API
        - Autenticação
        - Matching/ingredientes
        - Despensa/favoritos
        - Catálogo/importação
        - Banco de dados
        - CI/deploy
        - Documentação
        - Outra
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      placeholder: "Produção, local, navegador/dispositivo..."
  - type: textarea
    id: extra
    attributes:
      label: Contexto adicional
      description: Logs sem dados sensíveis, prints ou outras informações úteis.
