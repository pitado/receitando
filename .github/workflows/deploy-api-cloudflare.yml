name: Deploy API Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "backend/worker-prototype/**"
      - ".github/workflows/deploy-api-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-api-production
  cancel-in-progress: true

jobs:
  api-production:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/worker-prototype
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/worker-prototype/package-lock.json
      - run: npm ci
      - name: R2 bucket note
        shell: bash
        run: |
          echo "Using pre-created R2 bucket: receitando-recipe-images"
          echo "The deploy token does not need R2 bucket list/create permissions."
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:postgres
      - name: Test real WebSocket rooms locally
        run: npm run test:ws
      - name: Validate Worker build
        run: npm run dry-run
      # D1 migrations are intentionally skipped: the original D1 database is a rollback snapshot.
      - name: Deploy Worker
        run: npm run deploy
      - name: Smoke-test live Neon API after deployment
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.receitando.miguelpita.com.br';
          const routes=['/api/health','/api/v2/recipes','/api/recipes','/api/home-feed','/api/ingredients'];
          for (const route of routes) {
            let ok=false,lastStatus=0;
            for (let attempt=1; attempt<=10; attempt++) {
              try {
                const r=await fetch(base+route, {signal:AbortSignal.timeout(12000)});
                lastStatus=r.status;
                const json=await r.json().catch(()=>null);
                if(r.status===200 && json!==null && (!Array.isArray(json)||route==='/api/ingredients')){ok=true;break;}
              }catch(e){lastStatus=-1;}
              await new Promise(resolve=>setTimeout(resolve,2500));
            }
            console.log(JSON.stringify({route,passed:ok,status:lastStatus}));
            if(!ok)throw new Error('Production API failed health check at '+route);
          }
          NODE
      # Catalog image mirroring belongs to the dedicated import-wikibooks workflow.
