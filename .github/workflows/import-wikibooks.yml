name: Importar receitas do Wikilivros

on:
  workflow_dispatch:
    inputs:
      category:
        description: Escopo de receitas do Wikilivros
        required: true
        default: Todas as categorias
        type: choice
        options:
          - Todas as categorias
          - Salgados, Lanches e Sanduíches
          - Doces
          - Entradas
          - Massas
          - Quitandas
          - Sobremesas
      limit:
        description: Meta de receitas com imagem livre
        required: true
        default: "100"
        type: choice
        options:
          - "25"
          - "50"
          - "100"
          - "250"
          - "500"
          - "all"

permissions:
  contents: read

concurrency:
  group: wikibooks-import
  cancel-in-progress: false

jobs:
  import:
    name: descobrir e importar receitas com foto livre
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: backend/worker-prototype
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/worker-prototype/package-lock.json
      - run: npm ci
      - name: Aplicar migrations
        run: npm run migrate:remote
      - name: Importar receitas com imagens livres
        run: node scripts/import-wikibooks-v2.mjs --category "$CATEGORY" --limit "$LIMIT"
        env:
          CATEGORY: ${{ inputs.category }}
          LIMIT: ${{ inputs.limit }}
