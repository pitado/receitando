name: Referências brasileiras de receitas (somente links)
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Importar metadados e links no PostgreSQL? (requer NEON_IMPORT_URL no Secrets)"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/worker-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/worker-prototype/package-lock.json
      - run: npm ci
      - run: node --test tests/external-references.test.cjs
      - run: node scripts/import-external-references.mjs
      - name: Importar apenas links autorizados (sem scraping)
        if: ${{ inputs.apply == true }}
        env:
          POSTGRES_IMPORT_URL: ${{ secrets.NEON_IMPORT_URL }}
          ALLOW_EXTERNAL_REFERENCES_WRITE: "true"
        run: node scripts/import-external-references.mjs --apply
