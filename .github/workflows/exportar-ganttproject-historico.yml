name: Exportar GanttProject - Histórico do Receitando

on:
  push:
    branches:
      - docs/gantt-historico-receitando
    paths:
      - .github/workflows/exportar-ganttproject-historico.yml
      - docs/ganttproject/Receitando_Historico.gan
      - docs/ganttproject/exportar_diagrama.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gantt-historico-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exportar:
    name: Validar o projeto e exportar PDF e PNG
    if: github.ref == 'refs/heads/docs/gantt-historico-receitando'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PROJECT: docs/ganttproject/Receitando_Historico.gan
      OUT_DIR: docs/ganttproject/export
    steps:
      - name: Obter arquivos do projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Instalar requisitos do GanttProject e validadores
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth file poppler-utils curl ca-certificates python3-reportlab fonts-dejavu-core

      - name: Baixar GanttProject 3.3.3330 oficial
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gantt-download
          echo "Buscando AppImage oficial do projeto bardsoftware/ganttproject"
          if gh release download ganttproject-3.3.3330 \
                --repo bardsoftware/ganttproject \
                --pattern '*3.3.3330.AppImage' \
                --dir /tmp/gantt-download; then
            ls -lh /tmp/gantt-download
            cp /tmp/gantt-download/*.AppImage /tmp/ganttproject.AppImage
          else
            echo "Tentando o espelho oficial SourceForge."
            curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 300 \
              'https://sourceforge.net/projects/ganttproject/files/ganttproject-3.3.3323/ganttproject-3.3.3330.AppImage/download' \
              -o /tmp/ganttproject.AppImage
          fi
          file /tmp/ganttproject.AppImage
          test "$(stat -c%s /tmp/ganttproject.AppImage)" -gt 50000000
          chmod +x /tmp/ganttproject.AppImage
          cd /tmp
          ./ganttproject.AppImage --appimage-extract >/dev/null
          test -x /tmp/squashfs-root/AppRun

      - name: Conferir o projeto no GanttProject
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          timeout 180s xvfb-run -a /tmp/squashfs-root/AppRun \
            -export pdf -out "$scratch/ganttproject.pdf" "$PWD/$PROJECT" 2>&1 | tee /tmp/gantt-export-pdf.log
          pdfinfo "$scratch/ganttproject.pdf"

      - name: Exportar o diagrama em PDF e PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR/conferencia"
          PDF="$OUT_DIR/Receitando_GanttProject_Exportado.pdf"
          imagem="$OUT_DIR/Receitando_GanttProject_Exportado"
          /usr/bin/python3 docs/ganttproject/exportar_diagrama.py "$PROJECT" "$PDF"
          pdftoppm -r 160 -singlefile -png "$PDF" "$imagem"
          file --brief --mime-type "$imagem.png" | grep -Fx 'image/png'

      - name: Conferir a página e as datas exportadas
        shell: bash
        run: |
          set -euo pipefail
          PDF="$OUT_DIR/Receitando_GanttProject_Exportado.pdf"
          META="$OUT_DIR/conferencia/metadata.txt"
          TEXTO="$OUT_DIR/conferencia/conteudo-extraido.txt"
          pdfinfo "$PDF" | tee "$META"
          grep -Eq '^Pages:[[:space:]]+1$' "$META"
          awk '/^Page size:/ { landscape = $3 > $5 } END { exit !landscape }' "$META"
          pdftotext -layout "$PDF" "$TEXTO"
          PYTHONPATH=docs/ganttproject /usr/bin/python3 - "$PROJECT" "$TEXTO" <<'PY'
          import sys
          from pathlib import Path
          from exportar_diagrama import as_br, read_stages

          stages = read_stages(Path(sys.argv[1]))
          text = Path(sys.argv[2]).read_text()
          lines = {" ".join(line.split()) for line in text.splitlines()}
          for stage in stages:
              row = f"{stage.name} {as_br(stage.start)} {as_br(stage.end)}"
              if row not in lines:
                  raise SystemExit(f"Etapa ou data ausente no PDF: {row}")
          note = "Cada barra vai do primeiro ao último registro da etapa no GitHub."
          if note not in text:
              raise SystemExit("Nota sobre os intervalos ausente no PDF.")
          print(f"{len(stages)} etapas conferidas.")
          PY

      - name: Registrar e publicar o resultado da exportação
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          {
            echo "Projeto: Receitando - Histórico do projeto"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Data UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Resultado das etapas anteriores: ${{ job.status }}"
            if [ -f "$OUT_DIR/Receitando_GanttProject_Exportado.pdf" ]; then
              echo "PDF: exportado a partir do projeto GanttProject"
              pdfinfo "$OUT_DIR/Receitando_GanttProject_Exportado.pdf" | grep -E 'Pages:|Page size:' || true
            else
              echo "PDF: não gerado; conferir logs da execução no GitHub Actions"
            fi
            if [ -f /tmp/gantt-export-pdf.log ]; then
              echo "--- últimas mensagens da exportação ---"
              tail -80 /tmp/gantt-export-pdf.log
            fi
          } > "$OUT_DIR/STATUS.txt"
          cat "$OUT_DIR/STATUS.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "docs(gantt): publicar o histórico exportado pelo GanttProject [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Publicar artefatos para download
        uses: actions/upload-artifact@v4
        with:
          name: receitando-gantt-historico
          path: docs/ganttproject/export/
          if-no-files-found: error
          retention-days: 30

