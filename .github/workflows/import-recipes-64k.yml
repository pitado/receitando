name: Import 64K Recipe Catalog

on:
  workflow_dispatch:
    inputs:
      offset:
        description: "Índice inicial no dataset"
        required: true
        default: "0"
      limit:
        description: "Quantidade máxima de receitas neste lote"
        required: true
        default: "2000"
      batch_size:
        description: "Receitas por arquivo SQL"
        required: true
        default: "100"

jobs:
  import-catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/worker-prototype
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/worker-prototype/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: npm ci

      - name: Install KaggleHub
        run: python -m pip install --disable-pip-version-check kagglehub==1.0.2

      - name: Download public CC0 dataset
        run: |
          python - <<'PY'
          import kagglehub
          path = kagglehub.dataset_download(
              "prashantsingh001/recipes-dataset-64k-dishes",
              output_dir="dataset-64k",
          )
          print(f"Dataset baixado em: {path}")
          PY

      - name: Normalize dataset to JSON
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("dataset-64k")
          json_files = sorted(root.rglob("*.json"), key=lambda p: p.stat().st_size, reverse=True)
          csv_files = sorted(root.rglob("*.csv"), key=lambda p: p.stat().st_size, reverse=True)

          def valid_json(path: Path):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return None
              if isinstance(data, list) and data:
                  return data
              if isinstance(data, dict) and isinstance(data.get("recipes"), list) and data["recipes"]:
                  return data["recipes"]
              return None

          rows = None
          source = None
          for path in json_files:
              rows = valid_json(path)
              if rows:
                  source = path
                  break

          if rows is None:
              if not csv_files:
                  raise SystemExit("Nenhum JSON utilizável ou CSV encontrado no dataset baixado.")
              source = csv_files[0]
              with source.open("r", encoding="utf-8-sig", newline="") as handle:
                  rows = list(csv.DictReader(handle))

          if not rows:
              raise SystemExit("O dataset foi encontrado, mas não contém receitas utilizáveis.")

          output = root / "recipes-normalized.json"
          output.write_text(json.dumps(rows, ensure_ascii=False), encoding="utf-8")
          print(f"Fonte selecionada: {source}")
          print(f"Registros detectados: {len(rows)}")
          print(f"JSON normalizado: {output}")
          if isinstance(rows[0], dict):
              print(f"Colunas detectadas: {', '.join(rows[0].keys())}")
          PY

      - name: Build D1 SQL batches
        run: |
          rm -rf generated/64k
          node scripts/build-64k-import.mjs \
            --input dataset-64k/recipes-normalized.json \
            --output generated/64k \
            --offset "${{ inputs.offset }}" \
            --limit "${{ inputs.limit }}" \
            --batch-size "${{ inputs.batch_size }}"
          cat generated/64k/manifest.json

      - name: Apply catalog schema migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run migrate:remote

      - name: Import batches into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for file in generated/64k/batch-*.sql; do
            echo "Importando $file"
            npx wrangler d1 execute receitando --remote --file="$file" --yes
          done

      - name: Import summary
        run: cat generated/64k/manifest.json
