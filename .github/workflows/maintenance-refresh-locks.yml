name: Refresh audit lockfiles

on:
  push:
    branches:
      - refactor/final-audit-cleanup
    paths:
      - "backend/worker-prototype/package.json"
      - "frontend/package.json"
      - ".github/workflows/maintenance-refresh-locks.yml"

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/final-audit-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh API lockfile
        working-directory: backend/worker-prototype
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Refresh frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfiles
        run: |
          if git diff --quiet -- backend/worker-prototype/package-lock.json frontend/package-lock.json; then
            echo "Lockfiles já estão atualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/worker-prototype/package-lock.json frontend/package-lock.json
          git commit -m "chore: atualiza lockfiles"
          git push origin HEAD:refactor/final-audit-cleanup
