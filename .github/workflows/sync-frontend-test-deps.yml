name: Validate test expansion branch

on:
  push:
    branches: [test/frontend-worker-coverage]
    paths:
      - ".github/workflows/sync-frontend-test-deps.yml"
      - "frontend/**"
      - "backend/worker-prototype/src/**"
      - "backend/worker-prototype/tests/**"
      - "backend/worker-prototype/tsconfig.tests.json"

permissions:
  contents: read

jobs:
  validate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/frontend-worker-coverage

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/worker-prototype/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Frontend build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8787

      - name: Install API dependencies
        working-directory: backend/worker-prototype
        run: npm ci

      - name: API typecheck
        working-directory: backend/worker-prototype
        run: npm run typecheck

      - name: API tests
        working-directory: backend/worker-prototype
        run: npm test

      - name: API dry-run
        working-directory: backend/worker-prototype
        run: npm run dry-run
