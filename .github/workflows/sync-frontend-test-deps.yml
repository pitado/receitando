name: Sync frontend test dependencies

on:
  push:
    branches: [test/frontend-worker-coverage]
    paths:
      - ".github/workflows/sync-frontend-test-deps.yml"

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/frontend-worker-coverage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install test dependencies and refresh lockfile
        run: npm install --save-dev vitest @vitest/coverage-v8 @testing-library/react @testing-library/jest-dom jsdom
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Commit synchronized package files
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Package files already synchronized."
          else
            git commit -m "test: adiciona dependências de testes do frontend"
            git push origin HEAD:test/frontend-worker-coverage
          fi
