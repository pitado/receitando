name: Refresh PostgreSQL dependency lockfile

on:
  push:
    branches: [feat/postgres-hyperdrive-safe-migration]
    paths:
      - ".github/workflows/postgres-lockfile-temporary.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.repository == 'pitado/receitando' && github.ref == 'refs/heads/feat/postgres-hyperdrive-safe-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh only the backend lockfile
        working-directory: backend/worker-prototype
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/worker-prototype/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(postgres): lock pg dependencies for reproducible CI"
            git push origin HEAD:feat/postgres-hyperdrive-safe-migration
          fi
