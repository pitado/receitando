name: API Worker CI

on:
  push:
    branches: [main]
    paths:
      - "backend/worker-prototype/**"
      - ".github/workflows/api-worker-ci.yml"
      - ".github/workflows/deploy-api-cloudflare.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/worker-prototype/**"
      - ".github/workflows/api-worker-ci.yml"
      - ".github/workflows/deploy-api-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-api-worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: receitando_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: receitando_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d receitando_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend/worker-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/worker-prototype/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:postgres
      - name: Exercise real PostgreSQL compatibility and schema in CI
        env:
          POSTGRES_TEST_URL: postgres://postgres:receitando_ci_only@127.0.0.1:5432/receitando_ci
        run: npm run test:postgres:integration
      - name: Test real WebSocket rooms locally
        run: npm run test:ws
      - run: npm run dry-run
