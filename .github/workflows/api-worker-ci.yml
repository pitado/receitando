name: API Worker CI

on:
  push:
    branches: [main]
    paths:
      - "backend/worker-prototype/**"
      - ".github/workflows/api-worker-ci.yml"
      - ".github/workflows/deploy-api-cloudflare.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/worker-prototype/**"
      - ".github/workflows/api-worker-ci.yml"
      - ".github/workflows/deploy-api-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-api-worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: receitando_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: receitando_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d receitando_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend/worker-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/worker-prototype/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:postgres
      - name: Exercise real PostgreSQL compatibility and schema in CI
        env:
          POSTGRES_TEST_URL: postgres://postgres:receitando_ci_only@127.0.0.1:5432/receitando_ci
        run: npm run test:postgres:integration
      - name: Test real WebSocket rooms locally
        run: npm run test:ws
      - run: npm run dry-run

  # Verifica a API atual usando Neon antes de remover o banco D1 legado.
  probe-production-api:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Probe production PostgreSQL-backed endpoints
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://api.receitando.miguelpita.com.br';
          const routes = ['/api/health', '/api/v2/recipes', '/api/recipes', '/api/home-feed'];
          for (const route of routes) {
            let response;
            for (let attempt=0; attempt<3; attempt++) {
              try {response=await fetch(base+route, {signal:AbortSignal.timeout(18000)});break;}
              catch (e) {if (attempt===2) throw new Error('Could not reach '+route+': '+e.message);await new Promise(r=>setTimeout(r,1500));}
            }
            const body=await response.text();
            const json=(()=>{try{return JSON.parse(body)}catch{return null}})();
            console.log(JSON.stringify({route,status:response.status,json:!!json}));
            if(response.status!==200||!json)throw new Error('Production API endpoint unhealthy: '+route+', status='+response.status);
            if(route==='/api/health'&&json.status!=='ok')throw new Error('Unexpected health response');
          }
          NODE
