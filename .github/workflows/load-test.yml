name: Validação HTTP real — Receitando produção
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/load-test.yml'
      - 'tests/load/**'
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        description: "Carga HTTP limitada em produção"
        required: true
        default: professor-check
        options: [smoke, professor-check, capacity]
permissions:
  contents: read
jobs:
  production-http:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_SCENARIO: ${{ inputs.scenario || 'professor-check' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Medir REST real em produção (salas sintéticas, sem banco de usuários)
        run: |
          case "$TEST_SCENARIO" in
            smoke) echo "TARGET_WRITES=100" >> "$GITHUB_ENV"; echo "TARGET_READS=200" >> "$GITHUB_ENV" ;;
            professor-check) echo "TARGET_WRITES=1000" >> "$GITHUB_ENV"; echo "TARGET_READS=2000" >> "$GITHUB_ENV" ;;
            capacity) echo "TARGET_WRITES=10000" >> "$GITHUB_ENV"; echo "TARGET_READS=20000" >> "$GITHUB_ENV" ;;
            *) echo 'Cenário não autorizado para produção'; exit 1 ;;
          esac
      - name: Executar POST e GET no Worker publicado
        timeout-minutes: 25
        run: node tests/load/probe-production-http.mjs
      - name: Publicar evidências e erros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-http-${{ inputs.scenario || 'professor-check' }}
          path: results/load/production-http-read-probe.json
          if-no-files-found: warn
          retention-days: 14

  production-neon-reads:
    name: Produção — catálogo e Neon PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Medir 2.000 GETs reais no catálogo via API/Hyperdrive/Neon
        run: node tests/load/probe-production-neon-reads.mjs
      - name: Anexar métricas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-neon-read-evidence
          path: results/load/production-neon-read-evidence.json
          if-no-files-found: warn
          retention-days: 14
