version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /backend/worker-prototype
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      api-minor-patch:
        update-types:
          - minor
          - patch
