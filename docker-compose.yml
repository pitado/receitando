services:
  postgres:
    image: postgres:16-alpine
    container_name: receitando-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-receitando}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-receitando}
      POSTGRES_DB: ${POSTGRES_DB:-receitando}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: receitando-postgres-data
